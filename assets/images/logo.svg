<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" fill="none">
  <!-- MP geometric mark -->
  <g>
    <!-- Left vertical beam -->
    <rect x="4" y="8" width="6" height="44" fill="#b45309"/>
    <!-- M diagonal left -->
    <polygon points="10,8 22,28 22,8" fill="#b45309"/>
    <!-- M diagonal right -->
    <polygon points="22,8 34,28 34,8" fill="#b45309"/>
    <!-- M right vertical -->
    <rect x="34" y="8" width="6" height="44" fill="#b45309"/>
    <!-- P vertical -->
    <rect x="48" y="8" width="6" height="44" fill="#f7f6f4"/>
    <!-- P bowl top -->
    <path d="M54 8 Q70 8 70 20 Q70 32 54 32" stroke="#f7f6f4" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Company name -->
  <text x="82" y="28" font-family="'Oswald', 'Arial Narrow', Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#f7f6f4">MEJÍA PERALTA</text>
  <text x="82" y="46" font-family="'Oswald', 'Arial Narrow', Arial, sans-serif" font-size="10" font-weight="400" letter-spacing="3" fill="#b45309">CONSTRUCCIONES S.R.L</text>
  <!-- Accent line -->
  <line x1="82" y1="32" x2="216" y2="32" stroke="#b45309" stroke-width="1" opacity="0.4"/>
</svg>
